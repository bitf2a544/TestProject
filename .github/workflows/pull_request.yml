name: Run test

on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: Unit tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Dev, Uat, Production]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean test${{ matrix.flavor }}DebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assemble${{ matrix.flavor }}Debug
